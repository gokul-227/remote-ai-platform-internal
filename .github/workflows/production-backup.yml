name: Production backup (OPS-01)

# Independent, encrypted backup of the production database (public schema) and
# object storage, using the reviewed tooling in the app repo (ops/backup).
# Destination: Cloudflare R2 (owner decision 2026-10-02), outside Supabase,
# Render and GitHub. The archive is encrypted before upload (BACKUP_PASSPHRASE);
# R2 never sees plaintext.
#
# INERT UNTIL THE OWNER ENABLES IT:
#   1. Cloudflare dashboard: enable R2, create bucket `rap-backups` (location EU),
#      add a lifecycle rule deleting objects after 30 days, and create an R2 API
#      token with Object Read & Write on that bucket only.
#   2. Deliver these secrets to this repo via the Infisical GitHub Secret Sync
#      (never paste values into chat or commits):
#        BACKUP_SOURCE_DATABASE_URL   libpq form (postgresql://...), session pooler
#        BACKUP_S3_ENDPOINT, BACKUP_S3_ACCESS_KEY, BACKUP_S3_SECRET_KEY   Supabase Storage S3
#        BACKUP_PASSPHRASE            stored ALSO offline, apart from the archives
#        R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY
#   3. Run once with "Run workflow", then do the restore drill in backup-and-restore.md.
#   4. Uncomment the schedule (daily: RPO <= 24 h).
#
# R2 free tier: 10 GB storage, 1M writes / 10M reads per month; a 30-day daily
# rotation of a sub-GB archive stays inside it. Check the size in each run summary.

on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: "23 3 * * *"

permissions:
  contents: read

concurrency:
  group: production-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Secrets present
        env:
          A: ${{ secrets.BACKUP_SOURCE_DATABASE_URL }}
          B: ${{ secrets.BACKUP_S3_ENDPOINT }}
          C: ${{ secrets.BACKUP_PASSPHRASE }}
          D: ${{ secrets.R2_ACCESS_KEY_ID }}
        run: |
          if [ -z "$A" ] || [ -z "$B" ] || [ -z "$C" ] || [ -z "$D" ]; then
            echo "::error::backup secrets are not configured; see the header of this workflow"
            exit 1
          fi

      - name: Check out the backup tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: gokul-227/remote-ai-platform
          ref: prod
          sparse-checkout: ops/backup

      - name: Install the object-store client
        run: python3 -m pip install --quiet boto3

      - name: Back up
        env:
          PG_IMAGE: postgres:17-alpine
          SOURCE_DATABASE_URL: ${{ secrets.BACKUP_SOURCE_DATABASE_URL }}
          S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          S3_ACCESS_KEY: ${{ secrets.BACKUP_S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.BACKUP_S3_SECRET_KEY }}
          S3_BUCKETS: remote-ai-platform-resumes,remote-ai-platform-assets
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          OUT_DIR: ${{ runner.temp }}/backups
          PYTHON: python3
        run: |
          ops/backup/backup.sh
          ls -l "$OUT_DIR" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the encrypted archive to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          OUT_DIR: ${{ runner.temp }}/backups
        run: |
          for f in "$OUT_DIR"/*; do
            aws s3 cp "$f" "s3://rap-backups/$(basename "$f")" --endpoint-url "$R2_ENDPOINT" --only-show-errors
          done
          # Prove the upload: the remote checksum file must match the local one.
          sum=$(ls "$OUT_DIR"/*.sha256)
          aws s3 cp "s3://rap-backups/$(basename "$sum")" - --endpoint-url "$R2_ENDPOINT" | cmp - "$sum"
          echo "Uploaded $(ls "$OUT_DIR" | tr '\n' ' ')" >> "$GITHUB_STEP_SUMMARY"
